<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KC proposal presenter (temporary)</title>
<link rel="stylesheet" href="css/style.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B0D11}
#site{position:absolute;inset:0;width:1920px;height:1080px;border:0;transition:opacity .6s}
.card{position:absolute;inset:0;z-index:20;display:grid;place-items:center;align-content:center;gap:28px;background:radial-gradient(900px 500px at 50% 45%,#2a1a35,#0B0D11 70%);opacity:0;transition:opacity .8s;pointer-events:none;text-align:center}
.card.on{opacity:1}
.card img{width:180px;border-radius:24px;box-shadow:0 30px 80px -20px rgba(129,61,138,.8)}
.card h1{font:400 110px/0.95 Anton,sans-serif;text-transform:uppercase;color:#EEEAF2;margin:0}
.card h1 em{font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;color:#D9B07F}
.card p{font:600 20px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9C98A6;margin:0}
.card .stats{display:flex;gap:70px;justify-content:center;margin-top:10px;border:0;padding:0}
.card .stats b{display:block;font:400 72px Anton,sans-serif;color:#B177C1}
.card .stats span{font:600 16px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9C98A6}
.cap{position:absolute;z-index:30;left:72px;bottom:64px;max-width:1200px;padding:22px 30px 24px;border-radius:10px;background:rgba(11,13,17,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(238,234,242,.14);border-left:4px solid #D9B07F;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .6s cubic-bezier(.16,1,.3,1)}
.cap.on{opacity:1;transform:none}
.cap small{display:block;font:600 14px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#D9B07F;margin-bottom:8px}
.cap span{font:600 40px/1.2 Inter,'Noto Sans Tamil',sans-serif;color:#EEEAF2}
.lang-ta .cap span{font-family:'Noto Sans Tamil',Inter,sans-serif;font-size:36px}
.phone{position:absolute;z-index:15;left:50%;top:50%;width:420px;height:880px;margin:-440px 0 0 -210px;border-radius:56px;background:#050608;box-shadow:0 0 0 2px #2a2d33,0 50px 120px -30px rgba(129,61,138,.9);opacity:0;transition:opacity .7s;padding:18px 15px}
.phone.on{opacity:1}
.phone iframe{width:390px;height:844px;border:0;border-radius:40px;display:block}
.phone-bg{position:absolute;inset:0;z-index:14;background:radial-gradient(900px 600px at 50% 50%,#24162f,#0B0D11 70%);opacity:0;transition:opacity .7s}
.phone-bg.on{opacity:1}
.bubble{position:absolute;z-index:25;right:90px;top:110px;width:600px;max-height:820px;overflow:hidden;background:#0f1a14;border:1px solid rgba(37,211,102,.35);border-radius:18px;padding:22px 26px;box-shadow:0 40px 100px -30px #000;opacity:0;transform:translateX(30px);transition:opacity .6s,transform .7s cubic-bezier(.16,1,.3,1)}
.bubble.on{opacity:1;transform:none}
.bubble small{display:block;font:600 13px Inter;letter-spacing:.18em;text-transform:uppercase;color:#25D366;margin-bottom:12px}
.bubble pre{margin:0;white-space:pre-wrap;font:500 19px/1.45 Inter,sans-serif;color:#e9f5ec}
</style></head>
<body>
<iframe id="site" src="about:blank" title="site"></iframe>
<div class="phone-bg" id="phoneBg"></div>
<div class="phone" id="phone"><iframe id="ph" src="about:blank" title="phone"></iframe></div>
<div class="bubble" id="bubble"><small>Message KC Customs receives on WhatsApp</small><pre id="msg"></pre></div>
<div class="card" id="card"></div>
<div class="cap" id="cap"><small>KC Customs · Website proposal</small><span id="capT"></span></div>
<script type="module">
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const site = $('#site');
const W = () => site.contentWindow, D = () => site.contentDocument;
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(ms, fn) { return new Promise((res) => { const t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / ms); fn(ease(k)); k < 1 ? requestAnimationFrame(f) : res(); })(t0); }); }
async function scrollY(win, y, ms) { const y0 = win.scrollY; await tween(ms, (k) => win.scrollTo(0, y0 + (y - y0) * k)); }
const top = (doc, sel, off = 0) => doc.querySelector(sel).getBoundingClientRect().top + doc.defaultView.scrollY + off;
async function hscroll(el, dx, ms) { const x0 = el.scrollLeft; el.style.scrollSnapType = 'none'; await tween(ms, (k) => { el.scrollLeft = x0 + dx * k; }); }
function nav(frame, url) { return new Promise((res) => { frame.onload = () => res(); frame.src = url; }); }
function cap(t) { if (!t) { $('#cap').classList.remove('on'); return; } $('#capT').textContent = t; $('#cap').classList.add('on'); }
const click = (sel) => { const e = D().querySelector(sel); if (e) e.click(); };

window.setup = async (lang) => {
  document.body.classList.toggle('lang-ta', lang === 'ta');
  try { sessionStorage.clear(); } catch (e) {}
  await nav(site, 'index.html');
  try { W().sessionStorage.removeItem('kc-intro'); } catch (e) {}
  await document.fonts.ready;
  return true;
};

const T = {
  en: { title: 'A website for <em>KC Customs</em>', sub: 'Proposal · Chromepet, Chennai · November 2026', outT: 'Ready to go <em>live</em>', outS: 'Logo files · Original photos · Domain name' },
  ta: { title: 'A website for <em>KC Customs</em>', sub: 'முன்மொழிவு · குரோம்பேட், சென்னை · நவம்பர் 2026', outT: 'Ready to go <em>live</em>', outS: 'லோகோ · அசல் புகைப்படங்கள் · டொமைன்' },
};

window.run = async (act, caption, ms, lang) => {
  const L = T[lang] || T.en;
  const card = $('#card');
  if (act === 'intro') {
    card.innerHTML = `<img src="assets/media/logo-400.webp" alt=""><p>${L.sub}</p><h1>${L.title}</h1>
      <div class="stats"><div><b>84K</b><span>Instagram</span></div><div><b>17M+</b><span>YouTube views</span></div><div><b>0</b><span>Website</span></div></div>`;
    card.classList.add('on'); await sleep(700); cap(caption); await sleep(ms - 1500);
    // reload so the site's intro + hero animation plays fresh as the card fades
    try { sessionStorage.removeItem('kc-intro'); } catch (e) {}
    await nav(site, 'index.html?r=' + Date.now()); card.classList.remove('on'); cap(null); await sleep(800); return;
  }
  if (act === 'hero') { cap(caption); await sleep(ms * .55); await scrollY(W(), 0, 10); await sleep(ms * .45 - 200); return; }
  if (act === 'crafts') {
    await scrollY(W(), top(D(), '#crafts', -60), 1400); cap(caption);
    await sleep(500); await hscroll(D().querySelector('#crafts-track'), 1500, ms - 2600); await sleep(600); return;
  }
  if (act === 'builds') {
    await scrollY(W(), top(D(), '#builds', -50), 1300); cap(caption);
    await hscroll(D().querySelector('#builds-track'), 900, ms * .35);
    click('.filters .chip[data-filter="king"]'); await sleep(ms * .25);
    click('.filters .chip[data-filter="all"]'); await sleep(300);
    await hscroll(D().querySelector('#builds-track'), 1200, ms * .3); return;
  }
  if (act === 'process') {
    await scrollY(W(), top(D(), '#process', -50), 1200); cap(caption);
    const step = (ms - 1300) / 3;
    await sleep(step); click('#tab-hydro'); await sleep(step); click('#tab-floor'); await sleep(step - 100); return;
  }
  if (act === 'picker') {
    await scrollY(W(), top(D(), '#design', -50), 1200); cap(caption); await sleep(ms * .3);
    site.style.opacity = 0; await sleep(500); await nav(site, 'design.html'); site.style.opacity = 1;
    await sleep(ms * .3);
    const c = D().querySelector('.model[data-model="rxz"]'); c.dispatchEvent(new MouseEvent('mouseover', { bubbles: true })); await sleep(ms * .15);
    c.click(); await sleep(Math.max(400, ms * .25 - 1700)); return;
  }
  if (act === 'customise') {
    cap(caption);
    const pick = async (sel, wait) => { click(sel); await sleep(wait); };
    const s = (ms - 600) / 12.5;
    await pick('#panel [data-set="color"][data-val="#C4161C"]', s);
    await pick('#panel [data-set="finish"][data-val="chrome"]', s);
    await pick('#panel [data-set="accent"][data-val="#F2C200"]', s * .6);
    await pick('.st-steps button[data-k="graphics"]', s * .4); await pick('#panel [data-set="graphic"][data-val="flames"]', s);
    await pick('.st-steps button[data-k="airbrush"]', s * .4); await pick('#panel [data-set="art"][data-val="deity-murugan"]', s);
    await pick('.st-steps button[data-k="parts"]', s * .4); await pick('#panel [data-set="rims"][data-val="gold"]', s * .6);
    await pick('#panel [data-part="engine"][data-src="accent"]', s * .6);
    await pick('.st-steps button[data-k="hydro"]', s * .3); await pick('#panel [data-set="hydro"][data-val="roses"]', s * .4);
    { const c = D().querySelector('#panel [data-hydro-part="frontGuard"]'); c.checked = true; c.dispatchEvent(new Event('change', { bubbles: true })); await sleep(s * .6); }
    await pick('[data-act="compare"]', 200);
    const r = D().querySelector('#cmp input'); await tween(s * 1.6, (k) => { r.value = 20 + 60 * k; r.dispatchEvent(new Event('input')); });
    await pick('[data-act="compare"]', s * .6); return;
  }
  if (act === 'request') {
    cap(caption); click('.sum-actions [data-act="request"]'); await sleep(900);
    const ack = D().querySelector('#req input[name=ack]'); if (!ack.checked) ack.click();
    D().querySelector('#req input[name=name]').value = 'Customer'; await sleep(900);
    const m = await import('./configurator/exporter.js'); const st = await import('./configurator/store.js');
    const h = new URLSearchParams(W().location.hash.slice(1)).get('c'); const cfg = st.decode(h);
    $('#msg').textContent = m.whatsappText(cfg, st.refOf(cfg), 'https://your-domain/design.html#c=…', 'Customer');
    $('#bubble').classList.add('on'); await sleep(ms - 1900);
    return;
  }
  if (act === 'mobile') {
    $('#bubble').classList.remove('on'); D().querySelector('#req').close();
    await nav($('#ph'), 'index.html');
    $('#phoneBg').classList.add('on'); $('#phone').classList.add('on'); cap(caption); await sleep(900);
    const pw = $('#ph').contentWindow, pd = $('#ph').contentDocument;
    await scrollY(pw, top(pd, '#builds', -60), (ms - 1400) * .45);
    await hscroll(pd.querySelector('#builds-track'), 520, (ms - 1400) * .35);
    await sleep((ms - 1400) * .2); return;
  }
  if (act === 'rest') {
    await nav(site, 'index.html'); $('#phone').classList.remove('on'); $('#phoneBg').classList.remove('on');
    W().scrollTo(0, top(D(), '#academy', -50)); cap(caption); await sleep(ms * .3);
    await scrollY(W(), top(D(), '#about', -50), ms * .3); await sleep(ms * .1);
    await scrollY(W(), top(D(), '#visit', -40), ms * .25); return;
  }
  if (act === 'outro') {
    card.innerHTML = `<img src="assets/media/logo-400.webp" alt=""><h1>${L.outT}</h1><p>${L.outS}</p><p style="letter-spacing:.12em;color:#D9B07F">Beyond the Expectations</p>`;
    card.classList.add('on'); cap(caption); await sleep(ms - 200); return;
  }
};
</script>
</body></html>
